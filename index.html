<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Log</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --red:#c8102e; --dark:#1b1b1f; --grey:#f2f2f4; --line:#d6d6db; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:var(--grey); color:var(--dark); }
  header { background:var(--dark); color:#fff; padding:14px 16px; border-bottom:4px solid var(--red); }
  h1, h2, button { font-family:'Orbitron', Arial, sans-serif; font-weight:900; text-transform:uppercase; }
  h1 { margin:0; font-size:18px; letter-spacing:1px; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--red); }
  main { max-width:760px; margin:0 auto; padding:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; margin:10px 0 4px; font-weight:bold; }
  input, textarea, select { width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:6px; }
  textarea { min-height:70px; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1 1 200px; }
  .field { position:relative; }
  .mic { position:absolute; right:6px; top:6px; width:auto; padding:4px 8px; font-size:11px; }
  button { background:var(--red); color:#fff; border:0; border-radius:6px; padding:12px 16px; font-size:12px; cursor:pointer; margin:4px 4px 4px 0; }
  button.secondary { background:var(--dark); }
  button.listening { background:#e8a800; color:#000; }
  .line { border:1px solid var(--line); border-left:4px solid var(--red); border-radius:6px; padding:10px; margin-bottom:10px; background:#fafafa; }
  .small { font-size:12px; color:#666; }
  .job { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .hidden { display:none; }
  .partRow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .partRow input { flex:1 1 120px; }
  .partRow .pname { flex:3 1 220px; }
  .partRow .pqty { flex:0 1 80px; }
  .photos { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .photos .ph { position:relative; }
  .photos img { width:90px; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .photos .x { position:absolute; top:2px; right:2px; width:auto; padding:2px 7px; font-size:11px; margin:0; }  
</style>
</head>
<body>
<header><h1>Workshop Log</h1></header>
<main>

<!-- JOB LIST -->
<section id="listView">
  <div class="card">
    <h2>Saved jobs</h2>
    <div id="jobList"></div>
    <button onclick="newJob()">New job</button>
  </div>
</section>

<!-- JOB EDITOR -->
<section id="editView" class="hidden">
  <div class="card">
    <h2>Job details</h2>
    <div class="row">
      <div><label>Date</label><input type="date" id="date"></div>
      <div><label>Vessel</label><input id="vessel"></div>
    </div>
    <div class="row">
      <div><label>Engine number</label><input id="engine"></div>
      <div><label>Mechanic</label><input id="mechanic"></div>
    </div>
    <div class="row">
      <div><label>C car number</label><input id="ccar"></div>
      <div><label>Issue number</label><input id="issue"></div>
    </div>
    <label>Customer</label><input id="customer">
  </div>

  <div class="card">
    <h2>Work log</h2>
    <div id="lines"></div>
    <button class="secondary" onclick="addLine()">Add work line</button>
  </div>

  <div class="card">
    <h2>Conclusion: what fixed it</h2>
    <div class="field">
      <textarea id="conclusion" placeholder="Root cause and the actual fix"></textarea>
      <button class="mic" onclick="dictate('conclusion', this)">Mic</button>
    </div>
  </div>

  <button onclick="saveJob()">Save job</button>
  <button class="secondary" onclick="showList()">Back to list</button>
</section>

</main>
<script>
const KEY = 'workshopJobs';
let jobs = JSON.parse(localStorage.getItem(KEY) || '[]');
let current = null;

function $(id) { return document.getElementById(id); }
function persist() { localStorage.setItem(KEY, JSON.stringify(jobs)); }

function showList() {
  $('editView').classList.add('hidden');
  $('listView').classList.remove('hidden');
  const box = $('jobList');
  if (!jobs.length) { box.innerHTML = '<p class="small">No jobs saved yet.</p>'; return; }
  box.innerHTML = '';
  jobs.forEach((j, i) => {
    const d = document.createElement('div');
    d.className = 'job';
    d.innerHTML = '<div><strong>' + (j.vessel || 'No vessel') + '</strong><br><span class="small">' +
      (j.date || '') + ' | Issue ' + (j.issue || '-') + ' | ' + (j.mechanic || '') + '</span></div>';
    const b = document.createElement('button');
    b.textContent = 'Open';
    b.onclick = () => openJob(i);
    d.appendChild(b);
    box.appendChild(d);
  });
}

function newJob() {
  current = { id: Date.now(), date: new Date().toISOString().slice(0, 10), lines: [] };
  jobs.push(current);
  fillForm();
}

function openJob(i) { current = jobs[i]; fillForm(); }

const FIELDS = ['date', 'vessel', 'engine', 'mechanic', 'ccar', 'issue', 'customer', 'conclusion'];

function fillForm() {
  FIELDS.forEach(f => { $(f).value = current[f] || ''; });
  renderLines();
  $('listView').classList.add('hidden');
  $('editView').classList.remove('hidden');
}

function readForm() {
  FIELDS.forEach(f => { current[f] = $(f).value; });
  current.lines = [...document.querySelectorAll('.line')].map(el => ({
    action: el.querySelector('.action').value,
    result: el.querySelector('.result').value,
    parts: [...el.querySelectorAll('.partRow')]
      .map(r => ({
        name: r.querySelector('.pname').value.trim(),
        no: r.querySelector('.pno').value.trim(),
        qty: r.querySelector('.pqty').value
      }))
      .filter(p => p.name || p.no),
    photos: el.photoData || []


function saveJob() {
  readForm();
  persist();
  showList();
}

function addLine(data) {
  data = data || {};
  const el = document.createElement('div');
  el.className = 'line';
  el.innerHTML =
    '<label>Action taken</label><div class="field"><textarea class="action"></textarea><button class="mic">Mic</button></div>' +
    '<label>Result</label><div class="field"><textarea class="result"></textarea><button class="mic">Mic</button></div>' +
    '<label>Parts changed</label><div class="parts"></div>' +
    '<label>Photos</label><div class="photos"></div>' +
    '<button class="secondary camBtn">Take photo</button>' +
    '<button class="secondary galBtn">Choose photo</button>' +
    '<input type="file" accept="image/*" capture="environment" class="camIn hidden">' +
    '<input type="file" accept="image/*" multiple class="galIn hidden">' +
    '<button class="secondary remBtn">Remove line</button>';
  const set = (c, v) => { el.querySelector(c).value = v || ''; };
  set('.action', data.action); set('.result', data.result);

  const mics = el.querySelectorAll('.mic');
  mics[0].onclick = function () { dictateEl(el.querySelector('.action'), this); };
  mics[1].onclick = function () { dictateEl(el.querySelector('.result'), this); };

  // Parts list: a new empty row appears once the last row has a part and a part number
  const partsBox = el.querySelector('.parts');
  const addPartRow = p => {
    p = p || {};
    const row = document.createElement('div');
    row.className = 'partRow';
    row.innerHTML =
      '<input class="pname" placeholder="Part changed">' +
      '<input class="pno" placeholder="Part number">' +
      '<input class="pqty" type="number" min="1" placeholder="Qty">';
    row.querySelector('.pname').value = p.name || '';
    row.querySelector('.pno').value = p.no || '';
    row.querySelector('.pqty').value = p.qty || '';
    const check = () => {
      const rows = partsBox.querySelectorAll('.partRow');
      const last = rows[rows.length - 1];
      if (last === row && row.querySelector('.pname').value.trim() && row.querySelector('.pno').value.trim()) {
        addPartRow();
      }
    };
    row.querySelector('.pname').oninput = check;
    row.querySelector('.pno').oninput = check;
    partsBox.appendChild(row);
  };
  (data.parts || []).forEach(addPartRow);
  addPartRow();

  // Photos
  el.photoData = (data.photos || []).slice();
  const drawPhotos = () => {
    const box = el.querySelector('.photos');
    box.innerHTML = '';
    el.photoData.forEach((src, i) => {
      const w = document.createElement('div');
      w.className = 'ph';
      w.innerHTML = '<img src="' + src + '"><button class="x">X</button>';
      w.querySelector('.x').onclick = () => { el.photoData.splice(i, 1); drawPhotos(); };
      box.appendChild(w);
    });function addLine(data) {

    row.querySelector('.pqty').value = p.qty || '';

    row.querySelector('.pname').oninput = check;

    partsBox.appendChild(row);
  };

  addPartRow();

  // Photos
  el.photoData = (data.photos || []).slice();
  const drawPhotos = () => {
    const box = el.querySelector('.photos');
    box.innerHTML = '';
    el.photoData.forEach((src, i) => {
      const w = document.createElement('div');
      w.className = 'ph';
      w.innerHTML = '<img src="' + src + '"><button class="x">X</button>';
      w.querySelector('.x').onclick = () => { el.photoData.splice(i, 1); drawPhotos(); };
      box.appendChild(w);
    });
  };
  const takeFiles = async files => {
    for (const f of files) { el.photoData.push(await shrink(f)); }
    drawPhotos();
  };
  el.querySelector('.camBtn').onclick = () => el.querySelector('.camIn').click();
  el.querySelector('.galBtn').onclick = () => el.querySelector('.galIn').click();
  el.querySelector('.camIn').onchange = e => takeFiles(e.target.files);
  el.querySelector('.galIn').onchange = e => takeFiles(e.target.files);
  el.querySelector('.remBtn').onclick = () => el.remove();
  drawPhotos();

  $('lines').appendChild(el);
}

    drawPhotos();
  };
  el.querySelector('.camBtn').onclick = () => el.querySelector('.camIn').click();
  el.querySelector('.galBtn').onclick = () => el.querySelector('.galIn').click();
  el.querySelector('.camIn').onchange = e => takeFiles(e.target.files);
  el.querySelector('.galIn').onchange = e => takeFiles(e.target.files);

  drawPhotos();

  $('lines').appendChild(el);
}

function renderLines() {
  $('lines').innerHTML = '';
  (current.lines || []).forEach(addLine);
}
function shrink(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = url;
  });
}
// ---- Voice dictation ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function dictate(id, btn) { dictateEl($(id), btn); }

function dictateEl(target, btn) {
  if (!SR) { alert('Voice input is not supported in this browser. Try Chrome or Safari.'); return; }
  const startAction = btn.onclick;
  const MAX_MS = 120000;
  const base = target.value ? target.value + ' ' : '';
  let finalText = '';
  let wanted = true;
  let rec;

  const finish = () => {
    wanted = false;
    clearTimeout(timer);
    btn.classList.remove('listening');
    btn.textContent = 'Mic';
    btn.onclick = startAction;
  };

  const begin = () => {
    rec = new SR();
    rec.lang = 'en-GB';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) { finalText += t + ' '; } else { interim += t; }
      }
      target.value = base + finalText + interim;
    };
    rec.onend = () => { if (wanted) { try { begin(); } catch (err) { finish(); } } };
    rec.onerror = ev => {
      if (ev.error === 'no-speech' || ev.error === 'aborted') { return; }
      finish();
    };
    rec.start();
  };

  const timer = setTimeout(() => { wanted = false; if (rec) { rec.stop(); } finish(); }, MAX_MS);

  btn.classList.add('listening');
  btn.textContent = 'Stop';
  btn.onclick = () => { wanted = false; if (rec) { rec.stop(); } finish(); };
  begin();
}

showList();

</body>
</html>
