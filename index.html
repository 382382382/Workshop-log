<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Log</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --red:#c8102e; --dark:#1b1b1f; --grey:#f2f2f4; --line:#d6d6db; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:var(--grey); color:var(--dark); }
  header { background:var(--dark); color:#fff; padding:14px 16px; border-bottom:4px solid var(--red); }
  h1, h2, button { font-family:'Orbitron', Arial, sans-serif; font-weight:900; text-transform:uppercase; }
  h1 { margin:0; font-size:18px; letter-spacing:1px; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--red); }
  main { max-width:760px; margin:0 auto; padding:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; margin:10px 0 4px; font-weight:bold; }
  input, textarea, select { width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:6px; }
  textarea { min-height:70px; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1 1 200px; }
  .field { position:relative; }
  .mic { position:absolute; right:6px; top:6px; width:auto; padding:4px 8px; font-size:11px; }
  button { background:var(--red); color:#fff; border:0; border-radius:6px; padding:12px 16px; font-size:12px; cursor:pointer; margin:4px 4px 4px 0; }
  button.secondary { background:var(--dark); }
  button.listening { background:#e8a800; color:#000; }
  .line { border:1px solid var(--line); border-left:4px solid var(--red); border-radius:6px; padding:10px; margin-bottom:10px; background:#fafafa; }
  .small { font-size:12px; color:#666; }
  .job { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .hidden { display:none; }
</style>
</head>
<body>
<header><h1>Workshop Log</h1></header>
<main>

<!-- JOB LIST -->
<section id="listView">
  <div class="card">
    <h2>Saved jobs</h2>
    <div id="jobList"></div>
    <button onclick="newJob()">New job</button>
  </div>
</section>

<!-- JOB EDITOR -->
<section id="editView" class="hidden">
  <div class="card">
    <h2>Job details</h2>
    <div class="row">
      <div><label>Date</label><input type="date" id="date"></div>
      <div><label>Vessel</label><input id="vessel"></div>
    </div>
    <div class="row">
      <div><label>Engine number</label><input id="engine"></div>
      <div><label>Mechanic</label><input id="mechanic"></div>
    </div>
    <div class="row">
      <div><label>C car number</label><input id="ccar"></div>
      <div><label>Issue number</label><input id="issue"></div>
    </div>
    <label>Customer</label><input id="customer">
  </div>

  <div class="card">
    <h2>Work log</h2>
    <div id="lines"></div>
    <button class="secondary" onclick="addLine()">Add work line</button>
  </div>

  <div class="card">
    <h2>Conclusion: what fixed it</h2>
    <div class="field">
      <textarea id="conclusion" placeholder="Root cause and the actual fix"></textarea>
      <button class="mic" onclick="dictate('conclusion', this)">Mic</button>
    </div>
  </div>

  <button onclick="saveJob()">Save job</button>
  <button class="secondary" onclick="showList()">Back to list</button>
</section>

</main>
<script>
const KEY = 'workshopJobs';
let jobs = JSON.parse(localStorage.getItem(KEY) || '[]');
let current = null;

function $(id) { return document.getElementById(id); }
function persist() { localStorage.setItem(KEY, JSON.stringify(jobs)); }

function showList() {
  $('editView').classList.add('hidden');
  $('listView').classList.remove('hidden');
  const box = $('jobList');
  if (!jobs.length) { box.innerHTML = '<p class="small">No jobs saved yet.</p>'; return; }
  box.innerHTML = '';
  jobs.forEach((j, i) => {
    const d = document.createElement('div');
    d.className = 'job';
    d.innerHTML = '<div><strong>' + (j.vessel || 'No vessel') + '</strong><br><span class="small">' +
      (j.date || '') + ' | Issue ' + (j.issue || '-') + ' | ' + (j.mechanic || '') + '</span></div>';
    const b = document.createElement('button');
    b.textContent = 'Open';
    b.onclick = () => openJob(i);
    d.appendChild(b);
    box.appendChild(d);
  });
}

function newJob() {
  current = { id: Date.now(), date: new Date().toISOString().slice(0, 10), lines: [] };
  jobs.push(current);
  fillForm();
}

function openJob(i) { current = jobs[i]; fillForm(); }

const FIELDS = ['date', 'vessel', 'engine', 'mechanic', 'ccar', 'issue', 'customer', 'conclusion'];

function fillForm() {
  FIELDS.forEach(f => { $(f).value = current[f] || ''; });
  renderLines();
  $('listView').classList.add('hidden');
  $('editView').classList.remove('hidden');
}

function readForm() {
  FIELDS.forEach(f => { current[f] = $(f).value; });
  current.lines = [...document.querySelectorAll('.line')].map(el => ({
    action: el.querySelector('.action').value,
    result: el.querySelector('.result').value,
    test: el.querySelector('.test').value,
    testResult: el.querySelector('.testResult').value,
    part: el.querySelector('.part').value,
    partNo: el.querySelector('.partNo').value,
    qty: el.querySelector('.qty').value
  }));
}

function saveJob() {
  readForm();
  persist();
  showList();
}

function addLine(data) {
  data = data || {};
  const el = document.createElement('div');
  el.className = 'line';
  el.innerHTML =
    '<label>Action taken</label><div class="field"><textarea class="action"></textarea><button class="mic">Mic</button></div>' +
    '<label>Result</label><div class="field"><textarea class="result"></textarea><button class="mic">Mic</button></div>' +
    '<div class="row"><div><label>Test performed</label><input class="test"></div>' +
    '<div><label>Test result</label><input class="testResult"></div></div>' +
    '<div class="row"><div><label>Part changed</label><input class="part"></div>' +
    '<div><label>Part number (optional)</label><input class="partNo"></div>' +
    '<div><label>Qty</label><input class="qty" type="number" min="1"></div></div>' +
    '<button class="secondary">Remove line</button>';
  const set = (c, v) => { el.querySelector(c).value = v || ''; };
  set('.action', data.action); set('.result', data.result);
  set('.test', data.test); set('.testResult', data.testResult);
  set('.part', data.part); set('.partNo', data.partNo); set('.qty', data.qty);
  const mics = el.querySelectorAll('.mic');
  mics[0].onclick = function () { dictateEl(el.querySelector('.action'), this); };
  mics[1].onclick = function () { dictateEl(el.querySelector('.result'), this); };
  el.querySelector('.secondary').onclick = () => el.remove();
  $('lines').appendChild(el);
}

function renderLines() {
  $('lines').innerHTML = '';
  (current.lines || []).forEach(addLine);
}

// ---- Voice dictation ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function dictate(id, btn) { dictateEl($(id), btn); }

function dictateEl(target, btn) {
  if (!SR) { alert('Voice input is not supported in this browser. Try Chrome or Safari.'); return; }
  const startAction = btn.onclick;
  const rec = new SR();
  rec.lang = 'en-GB';
  rec.interimResults = false;
  btn.classList.add('listening');
  btn.textContent = 'Stop';
  const finish = () => {
    btn.classList.remove('listening');
    btn.textContent = 'Mic';
    btn.onclick = startAction;
  };
  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    target.value = (target.value ? target.value + ' ' : '') + text;
  };
  rec.onend = finish;
  rec.onerror = finish;
  btn.onclick = () => rec.stop();
  rec.start();
}

showList();
</script>
</body>
</html>
